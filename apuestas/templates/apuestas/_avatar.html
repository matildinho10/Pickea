{% load formato %}{# Foto del usuario, o sus iniciales si no tiene. Uso: include con u=usuario y tamano='chico' (opcional) #}{% if u.foto %}<img class="avatar{% if tamano %} avatar-{{ tamano }}{% endif %}" src="{{ u.foto.url }}" alt="" loading="lazy">{% else %}<span class="avatar{% if tamano %} avatar-{{ tamano }}{% endif %}" aria-hidden="true">{{ u.username|iniciales }}</span>{% endif %}
